<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRM Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: transparent !important;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #subtitle-container {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 8px;
            font-size: 18px;
            max-width: 80%;
            text-align: center;
            word-wrap: break-word;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 1000;
            cursor: move;
            user-select: none;
        }

        #connection-status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 20px;
            font-size: 14px;
            z-index: 1001;
        }

        .status-connected {
            background: rgba(34, 197, 94, 0.8) !important;
        }

        .status-disconnected {
            background: rgba(239, 68, 68, 0.8) !important;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
            z-index: 999;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="subtitle-container"></div>
    <!-- <div id="connection-status">連線中...</div> -->
    <div id="loading">
        <div class="spinner"></div>
        <div>載入中...</div>
    </div>

    <!-- Three.js 和 VRM 相關庫 -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
            "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.6/lib/three-vrm.module.min.js",
            "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.1.6/lib/three-vrm-animation.module.min.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';

        // ============= 全局變量 =============
        let scene, camera, renderer, controls;
        let currentVrm = null;
        let currentMixer = null;
        let clock = new THREE.Clock();
        let ws = null;
        let audioContext = null;
        let currentAudio = null;
        let subtitleElement = null;
        let statusElement = null;
        let loadingElement = null;

        // 音频播放队列变量
        let audioQueue = [];
        let isPlayingAudio = false;

        // ============= 動畫系統變量 =============
        let isVRM1 = true;
        let idleAction = null;
        let breathAction = null;
        let blinkAction = null;
        let idleAnimationManager = null;
        let useVRMAIdleAnimations = true;
        let idleAnimations = [];
        let isLoadingAnimations = false;
        let isIdleAnimationModeChanging = false;

        // 闲置动作的时间偏移量，让各个动作不同步
        const idleOffsets = {
            body: Math.random() * Math.PI * 2,
            leftArm: Math.random() * Math.PI * 2,
            rightArm: Math.random() * Math.PI * 2,
            head: Math.random() * Math.PI * 2,
            spine: Math.random() * Math.PI * 2
        };

        // ============= 初始化場景 =============
        function initScene() {
            const container = document.getElementById('canvas-container');
            
            // 場景
            scene = new THREE.Scene();
            scene.background = null;

            // 相機
            camera = new THREE.PerspectiveCamera(
                30,
                window.innerWidth / window.innerHeight,
                0.1,
                20
            );
            camera.position.set(0, 1.3, 2);

            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.max(1, window.devicePixelRatio));
            renderer.setClearColor(0x000000, 0);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 控制器
            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1.3, 0);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.update();

            // 燈光
            const light = new THREE.DirectionalLight(0xffffff, Math.PI);
            light.position.set(1, 3, 2).normalize();
            light.castShadow = true;
            light.shadow.mapSize.set(2048, 2048);
            scene.add(light);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.1);
            scene.add(ambientLight);

            // 地板 - 使用透明阴影材质
            const groundGeo = new THREE.PlaneGeometry(20, 20);
            const shadowMat = new THREE.ShadowMaterial({ opacity: 0.4 });
            const ground = new THREE.Mesh(groundGeo, shadowMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 字幕元素
            subtitleElement = document.getElementById('subtitle-container');
            // statusElement = document.getElementById('connection-status');
            loadingElement = document.getElementById('loading');

            // 字幕拖曳功能
            initSubtitleDrag();

            // 響應式
            window.addEventListener('resize', onWindowResize);
        }

        // ============= 自然姿勢設定 =============
        function setNaturalPose(vrm) {
            if (!vrm.humanoid) return;
            let v = 1;
            if (!isVRM1) {
                v = -1;
            }
            
            // 左臂自然下垂
            vrm.humanoid.getNormalizedBoneNode('leftUpperArm').rotation.z = -0.4 * Math.PI * v;

            // 右臂自然下垂
            vrm.humanoid.getNormalizedBoneNode('rightUpperArm').rotation.z = 0.4 * Math.PI * v;
            
            const leftHand = vrm.humanoid.getNormalizedBoneNode('leftHand');
            if (leftHand) {
                leftHand.rotation.z = 0.1 * v; // 手腕自然弯曲
                leftHand.rotation.x = 0.05;
            }
            const rightHand = vrm.humanoid.getNormalizedBoneNode('rightHand');
            if (rightHand) {
                rightHand.rotation.z = -0.1 * v; // 手腕自然弯曲
                rightHand.rotation.x = 0.05;
            }
            
            // 添加手指的自然弯曲（如果模型支持）
            const fingerBones = [
                'leftThumbProximal', 'leftThumbIntermediate', 'leftThumbDistal',
                'leftIndexProximal', 'leftIndexIntermediate', 'leftIndexDistal',
                'leftMiddleProximal', 'leftMiddleIntermediate', 'leftMiddleDistal',
                'leftRingProximal', 'leftRingIntermediate', 'leftRingDistal',
                'leftLittleProximal', 'leftLittleIntermediate', 'leftLittleDistal',
                'rightThumbProximal', 'rightThumbIntermediate', 'rightThumbDistal',
                'rightIndexProximal', 'rightIndexIntermediate', 'rightIndexDistal',
                'rightMiddleProximal', 'rightMiddleIntermediate', 'rightMiddleDistal',
                'rightRingProximal', 'rightRingIntermediate', 'rightRingDistal',
                'rightLittleProximal', 'rightLittleIntermediate', 'rightLittleDistal'
            ];

            fingerBones.forEach(boneName => {
                const bone = vrm.humanoid.getNormalizedBoneNode(boneName);
                if (bone) {
                    // 根据手指部位设置不同的弯曲度
                    if (boneName.includes('Thumb')) {
                        // 拇指稍微向内
                        bone.rotation.y = boneName.includes('left') ? 0.35 : -0.35;
                    } else if (boneName.includes('Proximal')) {
                        // 近端指骨轻微弯曲
                        bone.rotation.z = boneName.includes('left') ? -0.35 * v : 0.35 * v;
                    } else if (boneName.includes('Intermediate')) {
                        // 中端指骨稍微弯曲
                        bone.rotation.z = boneName.includes('left') ? -0.45 * v : 0.45 * v;
                    } else if (boneName.includes('Distal')) {
                        // 远端指骨轻微弯曲
                        bone.rotation.z = boneName.includes('left') ? -0.3 * v : 0.3 * v;
                    }
                }
            });
        }

        // ============= VRM 載入 =============
        async function loadVRM(modelPath) {
            console.log('Loading VRM:', modelPath);
            
            const loader = new GLTFLoader();
            loader.register((parser) => {
                return new VRMLoaderPlugin(parser, {
                    lookAt: { type: 'bone' }
                });
            });

            return new Promise((resolve, reject) => {
                loader.load(
                    modelPath,
                    (gltf) => {
                        const vrm = gltf.userData.vrm;
                        
                        // 移除舊模型
                        if (currentVrm) {
                            scene.remove(currentVrm.scene);
                            VRMUtils.deepDispose(currentVrm.scene);
                        }

                        // 優化模型
                        VRMUtils.removeUnnecessaryVertices(gltf.scene);
                        VRMUtils.removeUnnecessaryJoints(gltf.scene);

                        // 材質修正
                        vrm.scene.traverse((obj) => {
                            if (obj.material) {
                                if (Array.isArray(obj.material)) {
                                    obj.material.forEach(mat => {
                                        if (mat.transparent) {
                                            mat.depthWrite = false;
                                            mat.alphaTest = 0.5;
                                        }
                                    });
                                } else {
                                    if (obj.material.transparent) {
                                        obj.material.depthWrite = false;
                                        obj.material.alphaTest = 0.5;
                                    }
                                }
                                obj.castShadow = true;
                                obj.receiveShadow = true;
                            }
                        });

                        // 啟用物理模擬
                        if (vrm.springBoneManager) {
                            vrm.springBoneManager.reset();
                        }

                        scene.add(vrm.scene);
                        currentVrm = vrm;
                        currentMixer = new THREE.AnimationMixer(vrm.scene);
                        
                        // 检测 VRM 版本
                        isVRM1 = vrm.meta.metaVersion === '1';
                        
                        // 修正 VRM 0.x 模型朝向 (預設是背對鏡頭，需旋轉180度)
                        if (!isVRM1) {
                            VRMUtils.rotateVRM0(vrm);
                            console.log('🔄 VRM 0.x detected: rotated model 180 degrees to face camera');
                        }
                        
                        // 设置自然姿势
                        setNaturalPose(vrm);
                        
                        // 初始化动画系统
                        initAnimationSystem(vrm);

                        console.log('VRM loaded successfully');
                        resolve(vrm);
                    },
                    (progress) => {
                        console.log('Loading progress:', (progress.loaded / progress.total * 100).toFixed(2) + '%');
                    },
                    (error) => {
                        console.error('Error loading VRM:', error);
                        reject(error);
                    }
                );
            });
        }

        // ============= 動畫循環 =============
        function animate() {
            requestAnimationFrame(animate);

            const deltaTime = clock.getDelta();

            // 更新 VRM
            if (currentVrm) {
                currentVrm.update(deltaTime);
            }

            // 更新 Mixer
            if (currentMixer) {
                currentMixer.update(deltaTime);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // ============= WebSocket 連線 =============
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/vrm`;
            
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket connected');
                // statusElement.textContent = '已連線';
                // statusElement.className = 'status-connected';
                
                // 心跳
                setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send('ping');
                    }
                }, 30000);
            };

            ws.onmessage = async (event) => {
                try {
                    // 🔧 修復：檢查是否為純文本消息（如"pong"）
                    if (event.data === 'pong') {
                        console.log('🔊 [DEBUG] Received pong from server');
                        return;
                    }

                    // 嘗試解析JSON消息
                    const message = JSON.parse(event.data);
                    console.log('🔊 [DEBUG] Received message:', message.type);

                    if (message.type === 'speak') {
                        await handleSpeak(message.data);
                    } else if (message.type === 'switch_model') {
                        await loadVRM(message.data.path);
                    } else if (message.type === 'reset_expression') {
                        // 傳遞參數給 resetAllExpressions
                        resetAllExpressions(message.data);
                    } else if (message.type === 'play_animation') {
                        console.log('動畫功能暫時不可用');
                    } else if (message.type === 'config_updated') {
                        // 🔧 新增：配置更新通知
                        console.log('🔄 Animation config updated, reloading...');
                        await reloadAnimationConfiguration();
                    }
                } catch (error) {
                    console.error('🔊 [ERROR] Error handling WebSocket message:', error);
                    console.error('🔊 [ERROR] Raw message data:', event.data);
                }
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                // statusElement.textContent = '連線中斷';
                // statusElement.className = 'status-disconnected';
                
                // 重連
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        // ============= TTS 播放和口型同步 =============
        let currentExpression = null;
        let frameCount = 0;

        async function handleSpeak(data) {
            const { chunkId, text, expression, audioData, mimeType } = data;

            console.log('🎵 [QUEUE] Received audio chunk:', text);

            // 将音频数据加入队列
            audioQueue.push({
                chunkId,
                text,
                expression,
                audioData,
                mimeType
            });

            console.log(`🎵 [QUEUE] Added to queue. Queue length: ${audioQueue.length}`);

            // 如果当前没有播放，启动队列播放
            if (!isPlayingAudio) {
                console.log('🎵 [QUEUE] Not playing, starting queue playback');
                await playNextInQueue();
            } else {
                console.log('🎵 [QUEUE] Already playing, audio will play after current one finishes');
            }
        }

        // 播放队列中的下一个音频
        async function playNextInQueue() {
            // 如果队列为空，重置播放状态
            if (audioQueue.length === 0) {
                console.log('🎵 [QUEUE] Queue empty, stopping playback');
                isPlayingAudio = false;
                return;
            }

            // 标记正在播放
            isPlayingAudio = true;

            // 从队列中取出第一个音频数据
            const data = audioQueue.shift();
            console.log(`🎵 [QUEUE] Playing audio: "${data.text}" (${audioQueue.length} remaining in queue)`);

            const { text, expression, audioData, mimeType } = data;

            // 显示字幕
            showSubtitle(text);

            // 重置之前的表情，避免冲突
            if (currentVrm && currentVrm.expressionManager) {
                currentVrm.expressionManager.setValue('aa', 0);
                currentVrm.expressionManager.setValue('ih', 0);

                // 重置其他表情
                ['happy', 'angry', 'sad', 'surprised', 'relaxed'].forEach(exp => {
                    currentVrm.expressionManager.setValue(exp, 0);
                });
            }

            // 设定新的表情
            currentExpression = null;
            if (expression && currentVrm) {
                const validExpressions = ['happy', 'angry', 'sad', 'neutral', 'surprised', 'relaxed'];
                if (validExpressions.includes(expression)) {
                    currentExpression = expression;

                    // 配置表情和口型的冲突处理
                    if (currentVrm.expressionManager) {
                        // 设置口型表情为可覆盖
                        currentVrm.expressionManager.mouthExpressionNames = ['aa', 'ih'];

                        // 为特定表情设置口型覆盖属性
                        const mouthOverrideExpressions = ['happy', 'surprised'];
                        mouthOverrideExpressions.forEach(expName => {
                            const exp = currentVrm.expressionManager.getExpression?.(expName);
                            if (exp) {
                                exp.overrideMouth = 'block';
                            }
                        });

                        currentVrm.expressionManager.setValue(expression, 1.0);
                    }
                }
            }

            // 播放音频
            if (audioData) {
                await playAudioWithLipSync(audioData, mimeType);
            }

            // 播放完成后，继续播放队列中的下一个
            console.log('🎵 [QUEUE] Audio finished, checking for next in queue');
            await playNextInQueue();
        }

        async function playAudioWithLipSync(audioBase64, mimeType) {
            return new Promise(async (resolve, reject) => {
                try {
                    console.log('🔊 [DEBUG] Starting audio playback...');
                    console.log('🔊 [DEBUG] Audio data length:', audioBase64.length);
                    console.log('🔊 [DEBUG] MIME type:', mimeType);

                // 初始化 AudioContext
                if (!audioContext) {
                    console.log('🔊 [DEBUG] Creating new AudioContext...');
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }

                // 檢查 AudioContext 狀態
                if (audioContext.state === 'suspended') {
                    console.log('🔊 [DEBUG] AudioContext was suspended, resuming...');
                    await audioContext.resume();
                }

                // 停止當前音訊
                if (currentAudio) {
                    console.log('🔊 [DEBUG] Stopping previous audio...');
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                    currentAudio = null;
                }

                // 解碼 base64
                console.log('🔊 [DEBUG] Decoding base64 audio data...');
                const audioBytes = Uint8Array.from(atob(audioBase64), c => c.charCodeAt(0));
                const audioBlob = new Blob([audioBytes], { type: mimeType });
                const audioUrl = URL.createObjectURL(audioBlob);
                console.log('🔊 [DEBUG] Created audio URL:', audioUrl);

                // 創建音訊元素
                const audio = new Audio(audioUrl);
                currentAudio = audio;

                // 設置音訊屬性
                audio.volume = 1.0;
                audio.preload = 'auto';

                // 🔧 修復：檢查AudioContext是否已經連接過
                let source, analyser;
                try {
                    console.log('🔊 [DEBUG] Creating MediaElementSource...');
                    source = audioContext.createMediaElementSource(audio);
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 256;
                    analyser.smoothingTimeConstant = 0.8;

                    source.connect(analyser);
                    analyser.connect(audioContext.destination);
                    console.log('🔊 [DEBUG] Audio pipeline connected successfully');
                } catch (sourceError) {
                    console.error('🔊 [ERROR] Failed to create audio source:', sourceError);
                    // 如果AudioContext連接失敗，直接播放音頻（無口型同步）
                    analyser = null;
                    console.log('🔊 [DEBUG] Falling back to direct audio playback');
                }

                const bufferLength = analyser ? analyser.frequencyBinCount : 0;
                const dataArray = analyser ? new Uint8Array(bufferLength) : null;

                frameCount = 0;

                // 口型同步動畫
                const animateLipSync = () => {
                    if (audio.paused || audio.ended) {
                        console.log('🔊 [DEBUG] Audio ended, resetting expressions...');
                        // 播放結束，重置口型但保持其他表情
                        if (currentVrm && currentVrm.expressionManager) {
                            currentVrm.expressionManager.setValue('aa', 0);
                            currentVrm.expressionManager.setValue('ih', 0);
                            
                            // 保持當前表情一段時間
                            setTimeout(() => {
                                if (currentVrm && currentVrm.expressionManager) {
                                    ['happy', 'angry', 'sad', 'surprised', 'relaxed'].forEach(exp => {
                                        currentVrm.expressionManager.setValue(exp, 0);
                                    });
                                }
                            }, 2000);
                        }
                        return;
                    }

                    frameCount++;
                    
                    // 🔧 修復：檢查analyser是否存在
                    let intensity = 0;
                    if (analyser && dataArray) {
                        try {
                            analyser.getByteFrequencyData(dataArray);
                            
                            // 計算音量（僅使用中低頻）
                            const relevantData = dataArray.slice(0, Math.floor(bufferLength / 2));
                            const sum = relevantData.reduce((a, b) => a + b, 0);
                            const average = sum / relevantData.length;
                            intensity = Math.min(average / 128, 1.0);
                        } catch (analyserError) {
                            console.error('🔊 [ERROR] Audio analysis failed:', analyserError);
                            intensity = 0;
                        }
                    } else {
                        // 如果沒有analyser，使用基本的時間驅動口型動畫
                        intensity = Math.sin(frameCount * 0.2) * 0.3 + 0.3; // 基本口型動畫
                    }

                    // 驅動口型 - 大幅降低強度
                    if (currentVrm && currentVrm.expressionManager && intensity > 0.3) {
                        let maxMouthOpen = 0.4; // 大幅降低最大張嘴
                        
                        // 根據當前表情調整口型強度
                        if (currentExpression) {
                            if (['happy', 'surprised'].includes(currentExpression)) {
                                maxMouthOpen = 0.3; // 開心和驚訝表情時進一步降低
                            } else if (['angry', 'sad'].includes(currentExpression)) {
                                maxMouthOpen = 0.12;
                            }
                            
                            // 保持當前表情
                            currentVrm.expressionManager.setValue(currentExpression, 1.0);
                        }
                        
                        const mouthOpen = Math.min(intensity * 0.3, maxMouthOpen); // 大幅降低強度係數
                        currentVrm.expressionManager.setValue('aa', mouthOpen);
                        
                        // 添加細微的口型變化
                        const variation = Math.sin(frameCount * 0.1) * 0.02;
                        const ihValue = Math.min(Math.max(0, mouthOpen * 0.2 + variation), maxMouthOpen * 0.5);
                        currentVrm.expressionManager.setValue('ih', ihValue);
                    } else if (currentVrm && currentVrm.expressionManager) {
                        // 平滑閉嘴
                        const currentAA = currentVrm.expressionManager.getValue?.('aa') || 0;
                        const currentIH = currentVrm.expressionManager.getValue?.('ih') || 0;
                        currentVrm.expressionManager.setValue('aa', Math.max(0, currentAA * 0.7 - 0.01));
                        currentVrm.expressionManager.setValue('ih', Math.max(0, currentIH * 0.6 - 0.005));
                        
                        // 保持其他表情
                        if (currentExpression) {
                            currentVrm.expressionManager.setValue(currentExpression, 1.0);
                        }
                    }

                    requestAnimationFrame(animateLipSync);
                };

                // 🔧 修復：添加audio事件監聽器
                audio.addEventListener('loadstart', () => console.log('🔊 [DEBUG] Audio loading started...'));
                audio.addEventListener('loadeddata', () => console.log('🔊 [DEBUG] Audio data loaded'));
                audio.addEventListener('canplay', () => console.log('🔊 [DEBUG] Audio can start playing'));
                audio.addEventListener('play', () => console.log('🔊 [DEBUG] Audio playback started'));
                audio.addEventListener('error', (e) => console.error('🔊 [ERROR] Audio error:', e));

                // 結束時隱藏字幕并 resolve Promise
                audio.onended = () => {
                    console.log('🎵 [QUEUE] Audio playback completed');
                    hideSubtitle();
                    URL.revokeObjectURL(audioUrl);
                    currentAudio = null;
                    resolve(); // 通知播放完成
                };

                // 播放错误时也要 resolve，确保队列继续
                audio.onerror = (error) => {
                    console.error('🔊 [ERROR] Audio playback error:', error);
                    hideSubtitle();
                    URL.revokeObjectURL(audioUrl);
                    currentAudio = null;
                    resolve(); // 即使出错也继续队列
                };

                // 播放音頻
                console.log('🔊 [DEBUG] Starting audio playback...');
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            console.log('🔊 [DEBUG] Audio playback started successfully');
                            animateLipSync();
                        })
                        .catch(error => {
                            console.error('🔊 [ERROR] Audio playback failed:', error);
                            // 即使播放失敗，也要隱藏字幕并 resolve
                            hideSubtitle();
                            resolve();
                        });
                } else {
                    // 老版本瀏覽器
                    animateLipSync();
                }

                } catch (error) {
                    console.error('Error playing audio:', error);
                    hideSubtitle();
                    reject(error);
                }
            });
        }

        function resetAllExpressions(options = {}) {

        // ============= 完整的 IdleAnimationManager 類 =============
        class IdleAnimationManager {
            constructor(vrm, mixer) {
                this.vrm = vrm;
                this.mixer = mixer;
                this.currentIdleAction = null;
                this.defaultPoseAction = null;
                this.proceduralIdleAction = null;
                this.isTransitioning = false;
                this.animationQueue = [];
                this.currentIndex = 0;
                this.transitionDuration = 0.8;
                this.pauseBetweenAnimations = 1.5;
                this.idleWeight = 1.0;
                this.isActive = false;
                this.currentMode = 'none';
                this.randomPlayback = true;  // 隨機播放模式（true=隨機, false=順序）

                // 創建默認姿勢動作
                this.createDefaultPoseAction();
                // 創建程序化閒置動畫
                this.createProceduralIdleAction();

                console.log('IdleAnimationManager initialized');
            }
            
            // 創建默認姿勢動作
            createDefaultPoseAction() {
                try {
                    const defaultPoseClip = this.createDefaultPoseClip();
                    this.defaultPoseAction = this.mixer.clipAction(defaultPoseClip);
                    this.defaultPoseAction.setLoop(THREE.LoopOnce);
                    this.defaultPoseAction.clampWhenFinished = true;
                    this.defaultPoseAction.setEffectiveWeight(0);
                    console.log('Default pose action created');
                } catch (error) {
                    console.error('Error creating default pose action:', error);
                }
            }
            
            // 創建程序化閒置動畫
            createProceduralIdleAction() {
                try {
                    console.log('Creating procedural idle action...');
                    const idleClip = createIdleClip(this.vrm);
                    if (!idleClip) {
                        console.error('Failed to create idle clip');
                        return;
                    }
                    
                    this.proceduralIdleAction = this.mixer.clipAction(idleClip);
                    this.proceduralIdleAction.setLoop(THREE.LoopRepeat);
                    this.proceduralIdleAction.setEffectiveWeight(0);
                    
                    console.log('Procedural idle action created successfully');
                } catch (error) {
                    console.error('Error creating procedural idle action:', error);
                }
            }
            
            // 創建默認姿勢clip
            createDefaultPoseClip() {
                const tracks = [];
                const duration = 1.0;
                const fps = 30;
                const frameCount = duration * fps;
                
                const times = [];
                for (let i = 0; i <= frameCount; i++) {
                    times.push(i / fps);
                }
                
                const bonesToReset = [
                    'hips', 'spine', 'chest', 'upperChest', 'neck', 'head',
                    'leftShoulder', 'leftUpperArm', 'leftLowerArm', 'leftHand',
                    'rightShoulder', 'rightUpperArm', 'rightLowerArm', 'rightHand',
                    'leftUpperLeg', 'leftLowerLeg', 'leftFoot', 'leftToes',
                    'rightUpperLeg', 'rightLowerLeg', 'rightFoot', 'rightToes'
                ];
                
                bonesToReset.forEach(boneName => {
                    const bone = this.vrm.humanoid?.getNormalizedBoneNode(boneName);
                    if (!bone) return;
                    
                    const naturalRotation = this.getNaturalRotation(boneName);
                    const values = [];
                    
                    times.forEach((time, index) => {
                        if (index === 0) {
                            values.push(...bone.quaternion.toArray());
                        } else {
                            const progress = time / duration;
                            const easedProgress = this.easeInOutCubic(progress);
                            
                            const currentQuat = new THREE.Quaternion().fromArray(
                                values.slice((index - 1) * 4, index * 4)
                            );
                            
                            const interpolatedQuat = currentQuat.clone().slerp(naturalRotation, easedProgress);
                            values.push(...interpolatedQuat.toArray());
                        }
                    });
                    
                    const track = new THREE.QuaternionKeyframeTrack(
                        bone.name + '.quaternion',
                        times,
                        values
                    );
                    
                    tracks.push(track);
                });
                
                return new THREE.AnimationClip('defaultPose', duration, tracks);
            }
            
            easeInOutCubic(t) {
                return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            }
            
            getNaturalRotation(boneName) {
                const euler = new THREE.Euler(0, 0, 0);
                const v = isVRM1 ? 1 : -1;
                
                switch (boneName) {
                    case 'leftUpperArm':
                        euler.set(0, 0, -0.4 * Math.PI * v);
                        break;
                    case 'rightUpperArm':
                        euler.set(0, 0, 0.4 * Math.PI * v);
                        break;
                    case 'leftHand':
                        euler.set(0.05, 0, 0.1 * v);
                        break;
                    case 'rightHand':
                        euler.set(0.05, 0, -0.1 * v);
                        break;
                    default:
                        euler.set(0, 0, 0);
                        break;
                }
                
                const quaternion = new THREE.Quaternion();
                quaternion.setFromEuler(euler);
                return quaternion;
            }
            
            setAnimationQueue(animations) {
                this.animationQueue = [...animations];
                this.currentIndex = 0;
                console.log(`Idle animation queue set with ${animations.length} animations`);
            }
            
            startIdleLoop() {
                if (this.animationQueue.length === 0) {
                    console.warn('No idle animations available, switching to procedural mode');
                    this.switchToProceduralMode();
                    return;
                }
                
                console.log('Starting VRMA idle animation loop');
                this.currentMode = 'vrma';
                this.isActive = true;
                this.playNextVRMAAnimation();
            }
            
            playNextVRMAAnimation() {
                console.log(`🎮 [DEBUG] playNextVRMAAnimation called - isActive: ${this.isActive}, mode: ${this.currentMode}, queueLength: ${this.animationQueue.length}`);

                if (!this.isActive || this.currentMode !== 'vrma' || this.animationQueue.length === 0) {
                    console.log(`🚫 [DEBUG] Skipping playback - conditions not met`);
                    return;
                }

                if (this.isTransitioning) {
                    console.log(`⏳ [DEBUG] Still transitioning, retrying in 100ms`);
                    setTimeout(() => this.playNextVRMAAnimation(), 100);
                    return;
                }

                const animation = this.animationQueue[this.currentIndex];
                console.log(`🎭 [DEBUG] Playing VRMA animation: ${animation.name} (${this.currentIndex + 1}/${this.animationQueue.length})`);
                console.log(`📊 [DEBUG] Animation details:`, {
                    name: animation.name,
                    hasAnimation: !!animation.animation,
                    file: animation.file
                });

                this.playVRMAAnimation(animation);

                // 根據 randomPlayback 模式選擇下一個動畫
                const previousIndex = this.currentIndex;
                const length = this.animationQueue.length;

                if (this.randomPlayback) {
                    // 🎲 隨機模式：隨機選擇下一個（避免重複）
                    if (length < 2) {
                        this.currentIndex = 0;
                    } else {
                        let newIndex;
                        do {
                            newIndex = Math.floor(Math.random() * length);
                        } while (newIndex === previousIndex);
                        this.currentIndex = newIndex;
                    }
                    console.log(`🎲 [DEBUG] Random mode - Next animation index: ${this.currentIndex}`);
                } else {
                    // ⏭️ 順序模式：按順序播放
                    this.currentIndex = (previousIndex + 1) % length;
                    console.log(`⏭️ [DEBUG] Sequential mode - Next animation index: ${this.currentIndex}`);
                }
            }
            
            playVRMAAnimation(animationData) {
                if (!animationData || !animationData.animation) {
                    console.error('Invalid VRMA animation data');
                    this.scheduleNextVRMAAnimation();
                    return;
                }

                try {
                    // 🔧 修復：播放新動畫前，徹底清除舊動畫
                    if (this.currentIdleAction) {
                        console.log('🧹 Cleaning up previous VRMA animation...');
                        const oldAction = this.currentIdleAction;
                        const oldClip = oldAction.getClip();

                        // 只停止動作，不要 reset（避免骨骼瞬間跳變）
                        // reset 已經在 onVRMAAnimationFinished 的 fadeOut 之後處理
                        oldAction.stop();

                        // 從 mixer 中完全移除舊動畫的快取
                        this.mixer.uncacheAction(oldClip);
                        this.mixer.uncacheClip(oldClip);

                        this.currentIdleAction = null;
                        console.log('✅ Previous animation cleaned (without reset to avoid jump)');
                    }

                    // 需要動態匯入 createVRMAnimationClip
                    import('@pixiv/three-vrm-animation').then(({ createVRMAnimationClip }) => {
                        const clip = createVRMAnimationClip(animationData.animation, this.vrm);
                        if (!clip) {
                            console.error('Failed to create VRMA animation clip');
                            this.scheduleNextVRMAAnimation();
                            return;
                        }

                        console.log(`▶️ Playing VRMA animation: ${animationData.name}`);
                        this.currentIdleAction = this.mixer.clipAction(clip);
                        this.currentIdleAction.setLoop(THREE.LoopOnce);
                        this.currentIdleAction.clampWhenFinished = false;  // 🔧 改為 false，避免停在最後一幀
                        this.currentIdleAction.reset();  // 🔧 確保從頭開始

                        // 🎭 使用與舊動畫 fadeOut 相同的時間來 fadeIn，實現平滑的交叉淡入淡出
                        const crossfadeDuration = 1.2; // 與 onVRMAAnimationFinished 中的設定一致
                        this.currentIdleAction.fadeIn(crossfadeDuration);
                        this.currentIdleAction.play();
                        console.log(`🔼 New animation fading in (${crossfadeDuration}s)`);

                        const onFinished = (event) => {
                            if (event.action === this.currentIdleAction) {
                                console.log(`VRMA animation ${animationData.name} finished`);
                                this.onVRMAAnimationFinished();
                                this.mixer.removeEventListener('finished', onFinished);
                            }
                        };

                        this.mixer.addEventListener('finished', onFinished);
                    }).catch(error => {
                        console.error('Failed to load VRM animation library:', error);
                        this.scheduleNextVRMAAnimation();
                    });

                } catch (error) {
                    console.error(`Error playing VRMA animation ${animationData.name}:`, error);
                    this.scheduleNextVRMAAnimation();
                }
            }
            
            onVRMAAnimationFinished() {
                if (this.currentMode !== 'vrma' || !this.isActive) {
                    return;
                }

                console.log('VRMA animation finished, preparing for next animation');
                this.isTransitioning = true;

                // 🎭 交叉淡入淡出（Crossfade）策略：
                // 舊動畫開始淡出的同時，立即播放新動畫並淡入
                // 這樣可以避免中間出現 T-pose 的空檔期

                const oldAction = this.currentIdleAction;
                const crossfadeDuration = 1.2; // 交叉淡入淡出持續時間（秒）

                if (oldAction) {
                    // 開始淡出舊動畫
                    oldAction.fadeOut(crossfadeDuration);
                    console.log(`🔽 Old animation fading out (${crossfadeDuration}s)`);

                    // 在淡出完成後清理舊動畫
                    const oldClip = oldAction.getClip();
                    setTimeout(() => {
                        oldAction.stop();
                        oldAction.reset();
                        this.mixer.uncacheAction(oldClip);
                        this.mixer.uncacheClip(oldClip);
                        console.log('🧹 Old animation cleaned after fadeout');
                    }, crossfadeDuration * 1000 + 100); // 多等 100ms 確保淡出完成
                }

                // 立即清空 currentIdleAction，讓新動畫可以播放
                this.currentIdleAction = null;

                // 🔑 關鍵：立即開始播放新動畫（與舊動畫的淡出重疊）
                // 只需要極短的延遲（100ms）讓淡出開始
                setTimeout(() => {
                    if (this.currentMode !== 'vrma' || !this.isActive) {
                        this.isTransitioning = false;
                        return;
                    }

                    this.isTransitioning = false;

                    // 播放下一個動畫，它會以 crossfadeDuration 的時間淡入
                    this.playNextVRMAAnimation();

                }, 100); // 極短延遲，確保舊動畫開始淡出
            }
            
            scheduleNextVRMAAnimation() {
                if (this.currentMode === 'vrma' && this.isActive) {
                    setTimeout(() => {
                        this.playNextVRMAAnimation();
                    }, this.pauseBetweenAnimations * 1000);
                }
            }
            
            switchToVRMAMode() {
                console.log('Switching to VRMA idle animations');
                this.stopProceduralAnimations();
                
                if (this.animationQueue.length > 0) {
                    this.startIdleLoop();
                } else {
                    console.warn('No VRMA animations available, falling back to procedural');
                    this.switchToProceduralMode();
                }
            }
            
            switchToProceduralMode() {
                console.log('Switching to procedural idle animation');
                this.stopVRMAAnimations();
                
                this.currentMode = 'procedural';
                this.isActive = true;
                
                if (this.proceduralIdleAction) {
                    if (this.proceduralIdleAction.isRunning()) {
                        this.proceduralIdleAction.setEffectiveWeight(this.idleWeight);
                    } else {
                        this.proceduralIdleAction.reset();
                        this.proceduralIdleAction.setEffectiveWeight(this.idleWeight);
                        this.proceduralIdleAction.play();
                    }
                }
            }
            
            stopVRMAAnimations() {
                console.log('Stopping VRMA animations only');
                const fadeTime = 0.5;

                // 🔧 修復：停止並清除 VRMA 動畫
                if (this.currentIdleAction) {
                    const action = this.currentIdleAction;
                    const clip = action.getClip();

                    if (action.isRunning()) {
                        action.fadeOut(fadeTime);
                    }

                    setTimeout(() => {
                        action.stop();
                        action.reset();
                        this.mixer.uncacheAction(clip);
                        this.mixer.uncacheClip(clip);
                        console.log('🧹 VRMA animation cleaned in stopVRMA');
                    }, fadeTime * 1000);

                    this.currentIdleAction = null;
                }

                if (this.defaultPoseAction && this.defaultPoseAction.isRunning()) {
                    this.defaultPoseAction.fadeOut(fadeTime);
                }
            }
            
            stopProceduralAnimations() {
                console.log('Stopping procedural animations only');
                const fadeTime = 0.5;
                
                if (this.proceduralIdleAction && this.proceduralIdleAction.isRunning()) {
                    this.proceduralIdleAction.fadeOut(fadeTime);
                    setTimeout(() => {
                        if (this.proceduralIdleAction) {
                            this.proceduralIdleAction.stop();
                        }
                    }, fadeTime * 1000);
                }
            }
            
            stopAllAnimations() {
                console.log('Stopping all idle animations');
                this.isActive = false;
                this.isTransitioning = false;

                const fadeTime = 0.5;

                // 🔧 修復：停止並清除 VRMA 動畫
                if (this.currentIdleAction) {
                    const action = this.currentIdleAction;
                    const clip = action.getClip();

                    if (action.isRunning()) {
                        action.fadeOut(fadeTime);
                    }

                    setTimeout(() => {
                        action.stop();
                        action.reset();
                        this.mixer.uncacheAction(clip);
                        this.mixer.uncacheClip(clip);
                        console.log('🧹 Current idle action cleaned in stopAll');
                    }, fadeTime * 1000);

                    this.currentIdleAction = null;
                }

                if (this.proceduralIdleAction && this.proceduralIdleAction.isRunning()) {
                    this.proceduralIdleAction.fadeOut(fadeTime);
                    setTimeout(() => {
                        if (this.proceduralIdleAction) {
                            this.proceduralIdleAction.stop();
                        }
                    }, fadeTime * 1000);
                }

                if (this.defaultPoseAction && this.defaultPoseAction.isRunning()) {
                    this.defaultPoseAction.fadeOut(fadeTime);
                    setTimeout(() => {
                        if (this.defaultPoseAction) {
                            this.defaultPoseAction.stop();
                        }
                    }, fadeTime * 1000);
                }

                this.currentMode = 'none';
            }
        }

        // ============= 配置重載函數 =============
        async function reloadAnimationConfiguration() {
            if (!idleAnimationManager) {
                console.warn('Animation manager not available for reload');
                return;
            }

            try {
                console.log('🔄 Reloading animation configuration...');

                // 讀取配置（包括 randomPlayback）
                const configResponse = await fetch('/api/vrm/config');
                if (configResponse.ok) {
                    const data = await configResponse.json();
                    const config = data.VRMConfig;
                    const randomPlayback = config.randomPlayback !== undefined ? config.randomPlayback : true;

                    // 更新動畫管理器的隨機播放設定
                    idleAnimationManager.randomPlayback = randomPlayback;
                    console.log(`🎲 Random playback mode updated: ${randomPlayback ? 'ON (隨機)' : 'OFF (順序)'}`);
                }

                // 重新載入動畫配置
                const animationFiles = await getAnimationFiles();

                // 停止當前動畫
                idleAnimationManager.stopAllAnimations();

                // 清空當前動畫數據
                idleAnimations = [];
                isLoadingAnimations = false;

                // 重新載入動畫
                if (animationFiles.length > 0) {
                    console.log('📁 Loading new animation configuration...');
                    await loadIdleAnimations();

                    if (idleAnimations.length > 0) {
                        idleAnimationManager.setAnimationQueue(idleAnimations);
                        idleAnimationManager.switchToVRMAMode();
                        console.log('✅ Animation configuration reloaded successfully!');
                    } else {
                        console.warn('⚠️  No valid animations loaded, switching to procedural');
                        idleAnimationManager.switchToProceduralMode();
                    }
                } else {
                    console.log('ℹ️  No animations selected, switching to procedural mode');
                    idleAnimationManager.switchToProceduralMode();
                }

            } catch (error) {
                console.error('❌ Failed to reload animation configuration:', error);
                // 失敗時回到程序化動畫
                if (idleAnimationManager) {
                    idleAnimationManager.switchToProceduralMode();
                }
            }
        }

        // ============= 動畫載入和管理函數 =============
        async function getAnimationFiles() {
            try {
                console.log('🔄 [DEBUG] Fetching animation configuration from server...');
                const response = await fetch('/api/vrm/config');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                const config = data.VRMConfig;
                
                if (!config) {
                    throw new Error('Invalid config response: missing VRMConfig');
                }
                
                // 獲取選中的動畫 ID
                const selectedMotionIds = config.selectedMotionIds || [];
                console.log('✅ [DEBUG] Selected motion IDs from server:', selectedMotionIds);
                console.log('📊 [DEBUG] Config details:', {
                    selectedCount: selectedMotionIds.length,
                    defaultMotionsCount: config.defaultMotions.length,
                    userMotionsCount: config.userMotions.length
                });
                
                // 如果沒有選中的動畫，返回空數組（將使用程序化動畫）
                if (selectedMotionIds.length === 0) {
                    console.log('ℹ️  [DEBUG] No animations selected, will use procedural animations only');
                    return [];
                }
                
                // 獲取所有可用動畫
                const allMotions = [...config.defaultMotions, ...config.userMotions];
                console.log('📁 [DEBUG] Available motions:', allMotions.map(m => `${m.id}:${m.name}`));
                
                // 根據選中的 ID 篩選動畫並構造完整 URL
                const selectedAnimations = selectedMotionIds
                    .map(id => {
                        const motion = allMotions.find(m => m.id === id);
                        if (motion) {
                            const url = `${window.location.protocol}//${window.location.host}${motion.path}`;
                            console.log(`✅ [DEBUG] Found motion: ${id} -> ${url}`);
                            return url;
                        }
                        console.warn(`⚠️  [DEBUG] Animation not found: ${id}`);
                        return null;
                    })
                    .filter(url => url !== null);
                
                console.log(`🎭 [DEBUG] Final selected animations (${selectedAnimations.length}):`, selectedAnimations);
                return selectedAnimations;
                
            } catch (error) {
                console.error('❌ [DEBUG] Error getting animation files from config:', error);
                console.warn('🔙 [DEBUG] Falling back to procedural animations only (no VRMA files)');
                
                return [];
            }
        }

        async function loadVRMAAnimation(url) {
            return new Promise((resolve, reject) => {
                const loader = new GLTFLoader();
                
                // 🔧 正確註冊 VRMAnimationLoaderPlugin
                loader.register((parser) => {
                    return new VRMAnimationLoaderPlugin(parser);
                });
                
                loader.load(
                    url,
                    (gltf) => {
                        // ✅ 真實載入 VRM 動畫數據
                        const vrmAnimations = gltf.userData.vrmAnimations;
                        if (vrmAnimations && vrmAnimations.length > 0) {
                            console.log(`Successfully loaded animation: ${url.split('/').pop()}`);
                            resolve(vrmAnimations[0]); // 返回第一個動畫
                        } else {
                            console.warn(`No VRM animation found in: ${url}`);
                            resolve(null); // 沒有動畫時返回 null
                        }
                    },
                    (progress) => {
                        console.log(`Loading animation ${url.split('/').pop()}...`, 
                                  Math.round((progress.loaded / progress.total) * 100), '%');
                    },
                    (error) => {
                        console.error(`Failed to load animation: ${url}`, error);
                        // 🔧 失敗時返回 null 而不是 reject，保證其他動畫能繼續載入
                        resolve(null);
                    }
                );
            });
        }

        async function loadIdleAnimations() {
            if (isLoadingAnimations) return;
            isLoadingAnimations = true;
            
            console.log('Loading idle animations...');
            
            try {
                const animationFiles = await getAnimationFiles();
                idleAnimations = [];
                
                for (const file of animationFiles) {
                    try {
                        const animation = await loadVRMAAnimation(file);
                        if (animation) { // 只添加成功載入的動畫
                            idleAnimations.push({
                                animation: animation,
                                file: file,
                                name: file.split('/').pop().replace('.vrma', '')
                            });
                            console.log(`Loaded animation: ${file}`);
                        }
                    } catch (error) {
                        console.warn(`Failed to load animation: ${file}`, error);
                    }
                }
                
                console.log(`Successfully loaded ${idleAnimations.length} idle animations`);
                
            } catch (error) {
                console.error('Error loading idle animations:', error);
            } finally {
                isLoadingAnimations = false;
            }
        }

        async function startIdleAnimationLoop() {
            if (!idleAnimationManager) {
                console.error('Idle animation manager not available');
                return;
            }

            // 讀取隨機播放配置
            try {
                const configResponse = await fetch('/api/vrm/config');
                if (configResponse.ok) {
                    const data = await configResponse.json();
                    const config = data.VRMConfig;
                    const randomPlayback = config.randomPlayback !== undefined ? config.randomPlayback : true;
                    idleAnimationManager.randomPlayback = randomPlayback;
                    console.log(`🎲 Initial random playback mode: ${randomPlayback ? 'ON (隨機)' : 'OFF (順序)'}`);
                }
            } catch (error) {
                console.warn('Failed to load random playback config, using default (random):', error);
            }

            console.log(`Starting idle animation with mode: ${useVRMAIdleAnimations ? 'VRMA' : 'Procedural'}`);

            if (useVRMAIdleAnimations) {
                if (idleAnimations.length === 0) {
                    console.log('Loading VRMA animations...');
                    await loadIdleAnimations();
                }

                if (idleAnimations.length > 0) {
                    idleAnimationManager.setAnimationQueue(idleAnimations);
                    idleAnimationManager.switchToVRMAMode();
                } else {
                    console.warn('No VRMA animations available, falling back to procedural');
                    idleAnimationManager.switchToProceduralMode();
                }
            } else {
                idleAnimationManager.switchToProceduralMode();
            }
        }

        async function toggleIdleAnimationMode() {
            if (isIdleAnimationModeChanging || !idleAnimationManager) {
                return;
            }
            
            isIdleAnimationModeChanging = true;
            useVRMAIdleAnimations = !useVRMAIdleAnimations;
            
            console.log(`Switching idle animation mode to: ${useVRMAIdleAnimations ? 'VRMA' : 'Procedural'}`);
            
            try {
                if (useVRMAIdleAnimations) {
                    if (idleAnimations.length === 0) {
                        await loadIdleAnimations();
                    }
                    
                    if (idleAnimationManager) {
                        idleAnimationManager.setAnimationQueue(idleAnimations);
                        idleAnimationManager.switchToVRMAMode();
                    }
                } else {
                    if (idleAnimationManager) {
                        idleAnimationManager.switchToProceduralMode();
                    }
                }
            } catch (error) {
                console.error('Error switching idle animation mode:', error);
                useVRMAIdleAnimations = !useVRMAIdleAnimations;
            } finally {
                isIdleAnimationModeChanging = false;
            }
        }

        // ============= 動畫系統初始化 =============
        function initAnimationSystem(vrm) {
            console.log('初始化動畫系統...');
            
            // 創建呼吸動畫
            const breathClip = createBreathClip(vrm);
            if (breathClip) {
                breathAction = currentMixer.clipAction(breathClip);
                breathAction.setLoop(THREE.LoopRepeat);
                breathAction.play();
                console.log('呼吸動畫已啟動');
            }

            // 創建眨眼動畫
            const blinkClip = createBlinkClip(vrm);
            if (blinkClip) {
                blinkAction = currentMixer.clipAction(blinkClip);
                blinkAction.setLoop(THREE.LoopRepeat);
                blinkAction.play();
                console.log('眨眼動畫已啟動');
            }

            // 創建閒置動畫管理器
            idleAnimationManager = new IdleAnimationManager(vrm, currentMixer);

            // 開始閒置動畫循環
            startIdleAnimationLoop();
            
            console.log('動畫系統初始化完成');
        }

        // ============= 創建程序化閒置動畫 =============
        function createIdleClip(vrm) {
            const tracks = [];
            const fps = 30;
            const duration = 6; // 6秒周期
            const frameCount = duration * fps;
            
            // 生成時間數組
            const times = [];
            for (let i = 0; i <= frameCount; i++) {
                times.push(i / fps);
            }
            
            // VRM版本檢測
            const v = isVRM1 ? 1 : -1;
            
            // 需要動畫的骨骼列表
            const animatedBones = [
                'spine', 'chest', 'neck', 'head',
                'leftUpperArm', 'leftLowerArm', 'leftHand', 'leftShoulder',
                'rightUpperArm', 'rightLowerArm', 'rightHand', 'rightShoulder'
            ];
            
            animatedBones.forEach(boneName => {
                const bone = vrm.humanoid?.getNormalizedBoneNode(boneName);
                if (!bone) return;
                
                const values = [];
                
                // 為每個時間點計算旋轉值
                times.forEach(time => {
                    let euler = new THREE.Euler(0, 0, 0);
                    
                    // 使用周期性函數，確保在 t=0 和 t=duration 時值相同
                    const cycleTime = (time / duration) * 2 * Math.PI; // 0 到 2π
                    
                    switch (boneName) {
                        case 'spine':
                            euler.set(
                                Math.sin(cycleTime * 0.6 + idleOffsets.body) * 0.02,     
                                0,                                                    
                                Math.cos(cycleTime * 0.5 + idleOffsets.body) * 0.015    
                            );
                            break;
                            
                        case 'chest':
                            euler.set(
                                Math.sin(cycleTime * 0.6 + idleOffsets.body) * 0.01,     
                                0,                                                    
                                Math.cos(cycleTime * 0.5 + idleOffsets.body) * 0.0075   
                            );
                            break;
                            
                        case 'neck':
                            euler.set(
                                Math.cos(cycleTime * 1.2 + idleOffsets.head) * 0.01,     
                                Math.sin(cycleTime * 1.4 + idleOffsets.head) * 0.02,     
                                0                                                     
                            );
                            break;
                            
                        case 'head':
                            euler.set(
                                Math.sin(cycleTime * 1.0 + idleOffsets.head) * 0.02,     
                                Math.sin(cycleTime * 1.4 + idleOffsets.head) * 0.03,     
                                Math.cos(cycleTime * 0.8 + idleOffsets.head) * 0.01      
                            );
                            break;
                            
                        case 'leftUpperArm':
                            euler.set(
                                Math.cos(cycleTime * 0.7 + idleOffsets.leftArm) * 0.03, 
                                Math.sin(cycleTime * 0.6 + idleOffsets.leftArm) * 0.02,  
                                -0.4 * Math.PI * v + Math.sin(cycleTime * 1.5 + idleOffsets.leftArm) * 0.03
                            );
                            break;
                            
                        case 'leftLowerArm':
                            euler.set(
                                0,                                                   
                                0,                                                   
                                -Math.sin(cycleTime * 1.5 + idleOffsets.leftArm) * 0.02 
                            );
                            break;
                            
                        case 'leftHand':
                            euler.set(
                                0.05,                                                
                                0,                                                   
                                0.1 * v + Math.sin(cycleTime * 1.2 + idleOffsets.leftArm) * 0.015 
                            );
                            break;
                            
                        case 'leftShoulder':
                            euler.set(
                                0,                                                   
                                0,                                                   
                                Math.sin(cycleTime * 0.7 + idleOffsets.leftArm) * 0.02 
                            );
                            break;
                            
                        case 'rightUpperArm':
                            euler.set(
                                Math.cos(cycleTime * 0.8 + idleOffsets.rightArm) * 0.03,  
                                Math.sin(cycleTime * 0.64 + idleOffsets.rightArm) * 0.02, 
                                0.4 * Math.PI * v + Math.sin(cycleTime * 1.5 + idleOffsets.rightArm) * 0.03 
                            );
                            break;
                            
                        case 'rightLowerArm':
                            euler.set(
                                0,                                                    
                                0,                                                    
                                Math.sin(cycleTime * 1.5 + idleOffsets.rightArm) * 0.02 
                            );
                            break;
                            
                        case 'rightHand':
                            euler.set(
                                0.05,                                                 
                                0,                                                    
                                -0.1 * v + Math.sin(cycleTime * 1.2 + idleOffsets.rightArm) * 0.015 
                            );
                            break;
                            
                        case 'rightShoulder':
                            euler.set(
                                0,                                                    
                                0,                                                    
                                Math.sin(cycleTime * 0.8 + idleOffsets.rightArm) * 0.02  
                            );
                            break;
                            
                        default:
                            euler.set(0, 0, 0);
                            break;
                    }
                    
                    // 將歐拉角轉換為四元數並添加到值數組
                    const quaternion = new THREE.Quaternion();
                    quaternion.setFromEuler(euler);
                    values.push(...quaternion.toArray());
                });
                
                // 創建四元數關鍵幀軌道
                const track = new THREE.QuaternionKeyframeTrack(
                    bone.name + '.quaternion',
                    times,
                    values
                );
                
                tracks.push(track);
            });
            
            // 創建並返回動畫剪輯
            return new THREE.AnimationClip('idle', duration, tracks);
        }

        // ============= 創建呼吸動畫 =============
        function createBreathClip(vrm) {
            const tracks = [];
            const duration = 4; // 4秒一個呼吸周期
            const fps = 30;
            const frameCount = duration * fps;
            
            const times = [];
            for (let i = 0; i <= frameCount; i++) {
                times.push(i / fps);
            }
            
            // 呼吸縮放動畫
            const scaleValues = [];
            times.forEach(time => {
                const breathScale = 1 + Math.sin(time * Math.PI / 2) * 0.006; // 更自然的呼吸節奏
                scaleValues.push(breathScale, breathScale, breathScale);
            });
            
            const scaleTrack = new THREE.VectorKeyframeTrack(
                vrm.scene.name + '.scale',
                times,
                scaleValues
            );
            
            tracks.push(scaleTrack);
            return new THREE.AnimationClip('breath', duration, tracks);
        }

        // ============= 創建眨眼動畫 =============
        function createBlinkClip(vrm) {
            if (!vrm.expressionManager) return null;
            
            const tracks = [];
            const duration = 6; // 6秒周期，包含隨機間隔
            const fps = 30;
            const frameCount = duration * fps;
            
            const times = [];
            for (let i = 0; i <= frameCount; i++) {
                times.push(i / fps);
            }
            
            // 創建眨眼模式：在隨機時間點眨眼
            const blinkValues = [];
            times.forEach(time => {
                let blinkValue = 0;
                
                // 在第1.5秒單次眨眼
                if (time >= 1.4 && time <= 1.6) {
                    const progress = (time - 1.4) / 0.2;
                    blinkValue = Math.sin(progress * Math.PI);
                }
                // 在第4秒雙次眨眼
                else if (time >= 3.8 && time <= 4.4) {
                    const localTime = time - 3.8;
                    if (localTime < 0.15) {
                        blinkValue = Math.sin((localTime / 0.15) * Math.PI);
                    } else if (localTime > 0.25 && localTime < 0.4) {
                        blinkValue = Math.sin(((localTime - 0.25) / 0.15) * Math.PI);
                    }
                }
                
                blinkValues.push(blinkValue);
            });
            
            // 嘗試獲取眨眼表情軌道名稱
            const blinkTrackName = vrm.expressionManager.getExpressionTrackName?.('blink') || 'blink';
            
            const blinkTrack = new THREE.NumberKeyframeTrack(
                blinkTrackName,
                times,
                blinkValues
            );
            
            tracks.push(blinkTrack);
            return new THREE.AnimationClip('blink', duration, tracks);
        }

        // ============= 動畫播放處理 =============
        async function handlePlayAnimation(data) {
            const { animationId, animationData } = data;
            
            if (!currentVrm || !currentMixer) {
                console.error('VRM 或 Mixer 尚未初始化');
                return;
            }

            try {
                console.log('Playing animation:', animationId);
                
                // 載入動畫檔案
                const animationPath = animationData.path || `/vrm/animations/${animationId}.vrma`;
                await loadAndPlayAnimation(animationPath);
                
            } catch (error) {
                console.error('播放動畫失敗:', error);
            }
        }

        async function loadAndPlayAnimation(animationPath) {
            try {
                const loader = new GLTFLoader();
                loader.register((parser) => {
                    return new VRMAnimationLoaderPlugin(parser);
                });

                return new Promise((resolve, reject) => {
                    loader.load(
                        animationPath,
                        (gltf) => {
                            const vrmAnimations = gltf.userData.vrmAnimations;
                            if (vrmAnimations && vrmAnimations.length > 0 && currentVrm) {
                                // 停止所有正在播放的動畫
                                currentMixer.stopAllAction();
                                
                                // 創建 VRM 動畫剪輯
                                const clip = createVRMAnimationClip(vrmAnimations[0], currentVrm);
                                
                                if (clip) {
                                    // 播放動畫
                                    const action = currentMixer.clipAction(clip);
                                    action.reset();
                                    action.fadeIn(0.5);
                                    action.setLoop(THREE.LoopOnce);
                                    action.clampWhenFinished = true;
                                    action.play();

                                    // 動畫結束後的處理
                                    const onFinished = () => {
                                        action.fadeOut(0.5);
                                        currentMixer.removeEventListener('finished', onFinished);
                                        console.log('動畫播放完畢');
                                    };
                                    
                                    currentMixer.addEventListener('finished', onFinished);
                                    
                                    console.log('動畫開始播放');
                                    resolve(action);
                                } else {
                                    reject(new Error('無法創建動畫剪輯'));
                                }
                            } else {
                                reject(new Error('找不到 VRM 動畫數據'));
                            }
                        },
                        undefined,
                        (error) => {
                            console.error('載入動畫檔案失敗:', error);
                            reject(error);
                        }
                    );
                });
            } catch (error) {
                console.error('動畫載入錯誤:', error);
                throw error;
            }
        }

        // ============= 字幕控制 =============
        function showSubtitle(text) {
            subtitleElement.textContent = text;
            subtitleElement.style.display = 'block';
        }

        function hideSubtitle() {
            subtitleElement.style.display = 'none';
        }

        function initSubtitleDrag() {
            let isDragging = false;
            let startX, startY, initialX, initialY;

            subtitleElement.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                
                const rect = subtitleElement.getBoundingClientRect();
                initialX = rect.left + rect.width / 2;
                initialY = rect.top;
                
                subtitleElement.style.cursor = 'grabbing';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;

                const deltaX = e.clientX - startX;
                const deltaY = e.clientY - startY;

                const newX = ((initialX + deltaX) / window.innerWidth) * 100;
                const newY = ((initialY + deltaY) / window.innerHeight) * 100;

                subtitleElement.style.left = `${Math.max(10, Math.min(90, newX))}%`;
                subtitleElement.style.bottom = 'auto';
                subtitleElement.style.top = `${Math.max(5, Math.min(90, newY))}%`;
                subtitleElement.style.transform = 'translateX(-50%)';
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    subtitleElement.style.cursor = 'move';
                }
            });
        }

        // ============= 響應式 =============
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ============= 初始化 =============
        async function init() {
            try {
                console.log('開始初始化...');
                initScene();
                console.log('場景初始化完成');
                animate();
                console.log('動畫循環已啟動');

                // 連接 WebSocket
                connectWebSocket();
                console.log('WebSocket 連接已建立');

                // 從後端獲取當前選擇的 VRM
                console.log('獲取當前選擇的 VRM...');
                let vrmPath = '/vrm/Alice.vrm'; // 預設值
                try {
                    const response = await fetch('/api/vrm/current');
                    if (response.ok) {
                        const data = await response.json();
                        vrmPath = data.path;
                        console.log('從後端獲取到 VRM 路徑:', vrmPath);
                    } else {
                        console.warn('無法獲取當前 VRM，使用預設值');
                    }
                } catch (error) {
                    console.warn('獲取當前 VRM 失敗，使用預設值:', error);
                }

                // 載入 VRM
                console.log('開始載入 VRM:', vrmPath);
                await loadVRM(vrmPath);
                console.log('VRM 載入完成');

                // 隱藏載入畫面
                loadingElement.style.display = 'none';

                console.log('✅ Initialization complete');
            } catch (error) {
                console.error('❌ Initialization error:', error);
                loadingElement.innerHTML = '<div class="spinner"></div><div>載入失敗: ' + error.message + '</div>';
            }
        }

        // 啟動
        init();
    </script>
